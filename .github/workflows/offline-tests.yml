name: Offline regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium
      - name: Run isolated offline suite
        shell: bash
        run: |
          test_home=$(mktemp -d)
          env -i PATH="$PATH" LANG=C.UTF-8 HOME="$test_home" \
            PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" \
            python -m pytest -q
